<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RÉVA</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
<h1>RÉVA</h1>

<button onclick="openCart()">
🛒 <span id="cart-count">0</span>
</button>

</header>


<section class="hero">

<img src="IMG-20260719-WA0000.jpg" class="hero-image">

<div class="hero-content">
<h2>Luxury Fashion</h2>
<p>Elegant pieces made for you</p>
  <a href="#products" class="shop-btn">Shop Now</a>
<a href="#products" class="shop-btn">Shop Now</a>
</div>

</section>

<img src="IMG-20260719-WA0000.jpg" class="hero-image">

<h2>Luxury Fashion</h2>
<p>Elegant pieces made for you</p>

</section>


<section class="products" id="products">

<div class="product">
<img src="IMG-20260719-WA0002.jpg">
<h3>Black Blouse</h3>
<p class="price">450 EGP</p>
<button onclick="addToCart('Black Blouse',450)">
Add to Cart
</button>
</div>


<div class="product">
<img src="IMG-20260719-WA0001.jpg">
<h3>White Blouse</h3>
<p class="price">450 EGP</p>
<button onclick="addToCart('White Blouse',450)">
Add to Cart
</button>
</div>


<div class="product">
<img src="IMG-20260719-WA0007.jpg">
<h3>White Cardigan</h3>
<p class="price">550 EGP</p>
<button onclick="addToCart('White Cardigan',550)">
Add to Cart
</button>
</div>


<div class="product">
<img src="IMG-20260719-WA0003.jpg">
<h3>Olive Cardigan</h3>
<p class="price">500 EGP</p>
<button onclick="addToCart('Olive Cardigan',500)">
Add to Cart
</button>
</div>

</section>



<div id="cart-box">

<h2>Your Cart</h2>

<div id="cart-items"></div>

<h3>
Total: <span id="cart-total">0</span> EGP
</h3>

<button onclick="checkout()">
Checkout
</button>

<button onclick="closeCart()">
Close
</button>
<div id="checkout-box">

<h2>Complete Your Order</h2>

<input id="customer-name" placeholder="Your Name">

<input id="customer-phone" placeholder="Phone Number">

<textarea id="customer-address" placeholder="Address"></textarea>

<button onclick="sendOrder()">
Send Order
</button>

</div>
</div>



<script src="script.js"></script>

</body>
</html>
